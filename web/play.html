<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>播放 · 黄果剧场</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><span class="mark">黄</span><span class="name">黄果剧场</span></a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="index.html?cat=经典魔改">经典魔改</a>
        <a href="index.html?cat=AI魔改">AI魔改</a>
        <a href="index.html?cat=AI换脸">AI换脸</a>
        <a href="favorites.html">我的片单</a>
      </nav>
      <div class="nav-actions">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="nav-search" placeholder="搜索剧名 / 标签" />
        </div>
        <a class="btn btn-ghost btn-sm" href="login.html">登录</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="root" class="play-layout"></div>

    <section class="related" id="related" style="display:none">
      <div class="sec-head">
        <h2 class="sec-title">相关推荐</h2>
      </div>
      <div class="h-row" id="related-row"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap inner">
      <div>
        <a class="brand" href="index.html"><span class="mark">黄</span><span class="name">黄果剧场</span></a>
        <p style="margin-top:10px;font-size:12.5px;color:var(--text-faint)">高清短剧 · 沉浸观影</p>
      </div>
      <div class="links"><a href="#">关于我们</a><a href="#">服务条款</a><a href="#">隐私政策</a><a href="#">内容合作</a></div>
      <div style="font-size:12.5px">© 2026 黄果剧场</div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    (function () {
      App.initHeader();
      const id = App.qs("id");
      const root = document.getElementById("root");

      function mmss(sec) {
        sec = Math.max(0, Math.floor(sec));
        return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
      }

      function goLogin() {
        const back = "play.html?id=" + encodeURIComponent(id) + (App.qs("ep") ? "&ep=" + encodeURIComponent(App.qs("ep")) : "");
        location.href = "login.html?next=" + encodeURIComponent(back);
      }

      function buildPlayer(d, ep) {
        const p = document.createElement("div");
        p.className = "player";

        if (ep && ep.ready && ep.public_url) {
          p.innerHTML = `
            <video controls playsinline preload="metadata" poster="${App.esc(d.poster)}"></video>
            <div class="topbar"><span class="tt">${App.esc(d.t)} · 第${ep.episode_number}集</span></div>`;
          const v = p.querySelector("video");
          v.src = ep.public_url;
          return { el: p, video: v };
        }

        p.innerHTML = `
          <div class="frame">
            <img src="${App.esc(d.poster)}" alt="${App.esc(d.t)}" onerror="window.__posterFallback(this)" />
            <div class="tint"></div>
          </div>
          <div class="topbar"><span class="tt">${App.esc(d.t)} · 第${ep ? ep.episode_number : 1}集</span></div>
          <div class="center-play"><div class="big-play" style="opacity:.45"></div></div>
          <div style="position:absolute;left:0;right:0;bottom:16px;text-align:center;color:var(--text-dim);font-size:13px">本集视频处理中，请稍后再来</div>`;
        return { el: p, video: null };
      }

      function renderPage(d, episodes, epNumber) {
        let ep = episodes.find((x) => x.episode_number === epNumber);
        if (!ep) ep = episodes.find((x) => x.ready) || episodes[0];

        const player = buildPlayer(d, ep);

        const tags = (d.tags || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean).slice(0, 12);
        const fav = App.isFav(d.id);

        const info = document.createElement("div");
        info.innerHTML = `
          <div class="play-info">
            <h1 class="title">${App.esc(d.t)}</h1>
            <div class="meta">
              <span class="badge badge-accent">★ ${App.score(d)}</span>
              <span class="badge">${App.esc(d.cat || "精选")}</span>
              ${d.y ? `<span class="badge">${d.y}</span>` : ""}
              <span class="badge">全 ${episodes.length} 集</span>
              <span class="badge">${App.heat(d.heat)} 热度</span>
              <span class="badge badge-18">18+</span>
            </div>
            <p class="desc">${App.esc(d.d || "暂无简介")}</p>
            ${tags.length ? `<div class="tags">${tags.map((t) => `<span class="tag">${App.esc(t)}</span>`).join("")}</div>` : ""}
            <div class="info-actions">
              <button class="btn btn-primary" id="act-fav">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="${fav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
                <span>${fav ? "已加入片单" : "加入片单"}</span>
              </button>
              <button class="btn btn-ghost" id="act-share">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
                分享
              </button>
              <button class="btn btn-ghost" id="act-dl">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
                下载
              </button>
            </div>
          </div>`;

        const side = document.createElement("aside");
        side.className = "side";
        side.innerHTML = `
          <div class="side-card">
            <div class="side-head"><span class="t">选集</span><span class="n">共 ${episodes.length} 集</span></div>
            <div class="ep-list">
              ${episodes.map((e) => {
                const n = e.episode_number;
                const active = ep && String(e.id) === String(ep.id);
                const label = e.ready ? (active ? "播放中" : "可播放") : "处理中";
                return `<button class="ep-btn ${active ? "active" : ""}" data-ep-n="${n}">第 ${n} 集<span class="sm">${label}</span></button>`;
              }).join("")}
            </div>
          </div>`;

        info.querySelector("#act-fav").addEventListener("click", function () {
          const now = App.toggleFav(d.id);
          this.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="${now ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            <span>${now ? "已加入片单" : "加入片单"}</span>`;
        });
        info.querySelector("#act-share").addEventListener("click", () => {
          const url = location.origin + location.pathname + "?id=" + d.id;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => App.toast("链接已复制"), () => App.toast("复制失败"));
          } else {
            App.toast("链接：" + url);
          }
        });
        info.querySelector("#act-dl").addEventListener("click", () => App.toast("下载功能开发中"));

        side.querySelectorAll(".ep-btn").forEach((b) => {
          b.addEventListener("click", () => {
            const n = parseInt(b.dataset.epN, 10);
            const target = episodes.find((x) => x.episode_number === n);
            if (!target) return;
            if (!target.ready) { App.toast("本集视频处理中，请稍后再来"); return; }
            history.replaceState(null, "", "play.html?id=" + d.id + "&ep=" + n);
            renderPage(d, episodes, n);
          });
        });

        const left = document.createElement("div");
        left.appendChild(player.el);
        left.appendChild(info);

        root.innerHTML = "";
        root.appendChild(left);
        root.appendChild(side);

        const rel = App.dramas.filter((x) => x.cat === d.cat && String(x.id) !== String(d.id));
        const fill = rel.concat(App.dramas.filter((x) => String(x.id) !== String(d.id) && x.cat !== d.cat));
        const relList = [...new Map(fill.map((x) => [x.id, x])).values()].slice(0, 16);
        document.getElementById("related").style.display = "block";
        App.renderCards(document.getElementById("related-row"), relList);

        document.title = d.t + " · 黄果剧场";
        window.scrollTo({ top: 0 });
      }

      App.boot().then(async () => {
        const d = App.byId(id);
        if (!d) {
          root.innerHTML = `<div class="empty"><div class="big">🎬</div><p>未找到该剧集（ID: ${App.esc(id || "")}）</p>
            <a class="btn btn-primary" style="margin-top:18px" href="index.html">返回剧库</a></div>`;
          return;
        }

        // 登录鉴权
        if (!App.user) { goLogin(); return; }

        // 拉取真实剧集列表（含 R2 就绪状态）
        let res;
        try {
          res = await App.api("/api/drama/" + id + "/episodes");
        } catch (e) {
          root.innerHTML = `<div class="empty"><div class="big">⚠️</div><p>网络错误，请稍后重试</p>
            <a class="btn btn-primary" style="margin-top:18px" href="index.html">返回剧库</a></div>`;
          return;
        }
        if (res.status === 401) { App.clearSession(); goLogin(); return; }
        if (res.status !== 200 || !res.data || !res.data.ok || !Array.isArray(res.data.episodes)) {
          root.innerHTML = `<div class="empty"><div class="big">⚠️</div><p>加载失败：${App.esc((res.data && res.data.error) || "请稍后重试")}</p>
            <a class="btn btn-primary" style="margin-top:18px" href="index.html">返回剧库</a></div>`;
          return;
        }
        if (!res.data.episodes.length) {
          root.innerHTML = `<div class="empty"><div class="big">🎬</div><p>本剧集视频尚未上线</p>
            <a class="btn btn-primary" style="margin-top:18px" href="index.html">返回剧库</a></div>`;
          return;
        }

        const epNumber = parseInt(App.qs("ep") || "1", 10);
        renderPage(d, res.data.episodes, epNumber);
      });
    })();
  </script>
</body>
</html>
