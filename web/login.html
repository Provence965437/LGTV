<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 黄果剧场</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth">
    <!-- 左侧视觉 -->
    <div class="auth-visual">
      <div class="glow g1"></div>
      <div class="glow g2"></div>
      <a class="brand" href="index.html" style="position:relative;z-index:2;align-self:flex-start">
        <span class="mark">黄</span><span class="name">黄果剧场</span>
      </a>
      <div class="quote">
        <p>把好故事，<br />留给懂的人看。</p>
        <div class="by">HuangJu Theater · 高清短剧平台</div>
      </div>
    </div>

    <!-- 右侧表单 -->
    <div class="auth-panel">
      <div class="auth-card">
        <div class="head">
          <h1 id="auth-title">欢迎回来</h1>
          <p id="auth-sub">登录后即可收藏片单、同步观看进度</p>
        </div>

        <div class="tabs">
          <button id="tab-login" class="active">登录</button>
          <button id="tab-reg">注册</button>
        </div>

        <!-- 登录表单 -->
        <form id="form-login" novalidate>
          <div class="field">
            <input type="text" id="login-acc" placeholder=" " autocomplete="username" />
            <label>邮箱 / 手机号</label>
          </div>
          <div class="field">
            <input type="password" id="login-pass" placeholder=" " autocomplete="current-password" />
            <label>密码</label>
            <button type="button" class="eye" data-eye="login-pass" title="显示密码">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="row-between">
            <label><input type="checkbox" checked /> 记住我</label>
            <a href="#">忘记密码？</a>
          </div>
          <button type="submit" class="btn btn-primary">登 录</button>
        </form>

        <!-- 注册表单 -->
        <form id="form-reg" novalidate style="display:none">
          <div class="field">
            <input type="text" id="reg-acc" placeholder=" " autocomplete="username" />
            <label>邮箱 / 手机号</label>
          </div>
          <div class="field">
            <input type="password" id="reg-pass" placeholder=" " autocomplete="new-password" />
            <label>设置密码</label>
            <button type="button" class="eye" data-eye="reg-pass" title="显示密码">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field">
            <input type="password" id="reg-pass2" placeholder=" " autocomplete="new-password" />
            <label>确认密码</label>
          </div>
          <div class="row-between" style="justify-content:flex-start">
            <label><input type="checkbox" id="reg-agree" checked /> 我已阅读并同意<a href="#" style="margin-left:4px">服务条款</a></label>
          </div>
          <button type="submit" class="btn btn-primary">创建账号</button>
        </form>

        <div class="divider">或使用以下方式</div>
        <div class="socials">
          <button class="btn btn-ghost" data-s="微信">微信</button>
          <button class="btn btn-ghost" data-s="QQ">QQ</button>
        </div>

        <div class="auth-foot">
          <a href="index.html">← 返回首页浏览</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    (function () {
      const tabLogin = document.getElementById("tab-login");
      const tabReg = document.getElementById("tab-reg");
      const fLogin = document.getElementById("form-login");
      const fReg = document.getElementById("form-reg");
      const title = document.getElementById("auth-title");
      const sub = document.getElementById("auth-sub");

      function setTab(which) {
        const isLogin = which === "login";
        tabLogin.classList.toggle("active", isLogin);
        tabReg.classList.toggle("active", !isLogin);
        fLogin.style.display = isLogin ? "" : "none";
        fReg.style.display = isLogin ? "none" : "";
        title.textContent = isLogin ? "欢迎回来" : "创建账号";
        sub.textContent = isLogin ? "登录后即可收藏片单、同步观看进度" : "注册即享高清短剧与专属片单";
      }
      tabLogin.addEventListener("click", () => setTab("login"));
      tabReg.addEventListener("click", () => setTab("reg"));

      // 密码可见性
      document.querySelectorAll("[data-eye]").forEach((b) => {
        b.addEventListener("click", () => {
          const inp = document.getElementById(b.dataset.eye);
          inp.type = inp.type === "password" ? "text" : "password";
        });
      });

      // 第三方登录（原型演示）
      document.querySelectorAll("[data-s]").forEach((b) => {
        b.addEventListener("click", () => App.toast(b.dataset.s + " 登录为原型演示"));
      });

      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const PHONE_RE = /^1\d{10}$/;
      const valid = (a) => EMAIL_RE.test(a) || PHONE_RE.test(a);

      async function submit(btn, path, payload) {
        const orig = btn.textContent;
        btn.disabled = true;
        btn.textContent = "请稍候…";
        try {
          const { status, data } = await App.api(path, { method: "POST", body: JSON.stringify(payload) });
          if (status === 200 && data && data.ok) {
            App.setSession(data.token, data.user);
            App.toast(path.includes("register") ? "注册成功，已自动登录" : "登录成功");
            setTimeout(() => {
              const next = App.qs("next") || "";
              location.href = (!next || /^(https?:)?\/\//i.test(next)) ? "index.html" : next;
            }, 800);
          } else {
            App.toast((data && data.error) || "操作失败，请重试");
          }
        } catch (err) {
          App.toast("网络错误，请检查连接");
        } finally {
          btn.disabled = false;
          btn.textContent = orig;
        }
      }

      fLogin.addEventListener("submit", (e) => {
        e.preventDefault();
        const acc = document.getElementById("login-acc").value.trim();
        const pass = document.getElementById("login-pass").value;
        if (!acc) return App.toast("请输入邮箱或手机号");
        if (!valid(acc)) return App.toast("邮箱或手机号格式不正确");
        if (pass.length < 6) return App.toast("密码至少 6 位");
        submit(e.submitter || fLogin.querySelector("button[type=submit]"), "/api/login", { account: acc, password: pass });
      });

      fReg.addEventListener("submit", (e) => {
        e.preventDefault();
        const acc = document.getElementById("reg-acc").value.trim();
        const p1 = document.getElementById("reg-pass").value;
        const p2 = document.getElementById("reg-pass2").value;
        if (!acc) return App.toast("请输入邮箱或手机号");
        if (!valid(acc)) return App.toast("邮箱或手机号格式不正确");
        if (p1.length < 6) return App.toast("密码至少 6 位");
        if (p1 !== p2) return App.toast("两次输入的密码不一致");
        if (!document.getElementById("reg-agree").checked) return App.toast("请先同意服务条款");
        submit(e.submitter || fReg.querySelector("button[type=submit]"), "/api/register", { account: acc, password: p1 });
      });
    })();
  </script>
</body>
</html>
